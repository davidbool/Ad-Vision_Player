name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Generating changelog for version $VERSION"
          
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Save changelog to file
          cat > RELEASE_NOTES.md <<EOF
          ## TV Box Player v${VERSION}
          
          ### Changes
          ${CHANGELOG}
          
          ### Downloads
          - **Android TV Box**: app-release.apk
          - **Mobile Android**: android-app-release.apk / android-app-release.aab
          - **Mobile iOS**: ios-app-release.ipa (requires TestFlight or Apple Developer)
          
          ### Installation
          - See [BUILD.md](BUILD.md) for build instructions
          - See [DEPLOYMENT.md](DEPLOYMENT.md) for deployment guide
          
          ### Requirements
          - Android TV Box: Android 6.0+ (API 23+)
          - Mobile Android: Android 5.0+ (API 21+)
          - Mobile iOS: iOS 12.0+
          EOF
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: TV Box Player v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  build-android-tv:
    name: Build Android TV Release
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Update version
        run: |
          cd android-tv-app
          sed -i "s/versionName = \".*\"/versionName = \"${{ needs.create-release.outputs.version }}\"/" app/build.gradle.kts
          VERSION_CODE=$(date +%s)
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
      
      - name: Grant execute permission for gradlew
        run: chmod +x android-tv-app/gradlew
      
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android-tv-app/release.keystore
      
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android-tv-app
          if [ -f "release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi
      
      - name: Generate checksum
        run: |
          cd android-tv-app/app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
      
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: android-tv-app/app/build/outputs/apk/release/app-release.apk
          asset_name: tvbox-player-androidtv-v${{ needs.create-release.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive
      
      - name: Upload checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: android-tv-app/app/build/outputs/apk/release/app-release.apk.sha256
          asset_name: tvbox-player-androidtv-v${{ needs.create-release.outputs.version }}.apk.sha256
          asset_content_type: text/plain

  build-mobile-android:
    name: Build Mobile Android Release
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Update version
        run: |
          cd mobile-app
          npm version ${{ needs.create-release.outputs.version }} --no-git-tag-version
      
      - name: Install dependencies
        run: |
          cd mobile-app
          npm ci
      
      - name: Grant execute permission for gradlew
        run: chmod +x mobile-app/android/gradlew
      
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > mobile-app/android/app/release.keystore
      
      - name: Build release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile-app/android
          if [ -f "app/release.keystore" ]; then
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --no-daemon
          else
            ./gradlew assembleRelease bundleRelease --no-daemon
          fi
      
      - name: Generate checksums
        run: |
          cd mobile-app/android/app/build/outputs
          sha256sum apk/release/app-release.apk > apk/release/app-release.apk.sha256
          sha256sum bundle/release/app-release.aab > bundle/release/app-release.aab.sha256
      
      - name: Upload APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          asset_name: tvbox-player-mobile-android-v${{ needs.create-release.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive
      
      - name: Upload AAB
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          asset_name: tvbox-player-mobile-android-v${{ needs.create-release.outputs.version }}.aab
          asset_content_type: application/x-authorware-bin

  build-mobile-ios:
    name: Build Mobile iOS Release
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      
      - name: Update version
        run: |
          cd mobile-app
          npm version ${{ needs.create-release.outputs.version }} --no-git-tag-version
      
      - name: Install dependencies
        run: |
          cd mobile-app
          npm ci
      
      - name: Install CocoaPods
        run: |
          cd mobile-app/ios
          pod install
      
      - name: Build iOS (if certificates available)
        run: |
          cd mobile-app/ios
          if [ ! -z "${{ secrets.IOS_CERTIFICATE_BASE64 }}" ]; then
            xcodebuild -workspace tvboxplayermobile.xcworkspace \
              -scheme tvboxplayermobile \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath $RUNNER_TEMP/tvboxplayer.xcarchive \
              clean archive
          else
            echo "⚠️ iOS signing not configured. Skipping iOS build."
            echo "To enable iOS builds, configure iOS signing secrets."
          fi
