name: Mobile Android Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-android-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lint-and-test:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      
      - name: Install dependencies
        run: |
          cd mobile-app
          npm ci
      
      - name: Run lint
        run: |
          cd mobile-app
          npm run lint
      
      - name: Run type check
        run: |
          cd mobile-app
          npm run type-check
      
      - name: Run tests
        run: |
          cd mobile-app
          npm test -- --coverage --watchAll=false

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile-app/coverage/

  build-android-debug:
    name: Build Android Debug
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Install dependencies
        run: |
          cd mobile-app
          npm ci
      
      - name: Grant execute permission for gradlew
        run: chmod +x mobile-app/android/gradlew
      
      - name: Build Android debug APK
        run: |
          cd mobile-app/android
          ./gradlew assembleDebug --no-daemon
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Install dependencies
        run: |
          cd mobile-app
          npm ci
      
      - name: Grant execute permission for gradlew
        run: chmod +x mobile-app/android/gradlew
      
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mobile-app/android/app/release.keystore
      
      - name: Build Android release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile-app/android
          if [ -f "app/release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --no-daemon
          else
            echo "⚠️ No keystore found, building unsigned release APK"
            ./gradlew assembleRelease --no-daemon
          fi
      
      - name: Build Android App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile-app/android
          if [ -f "app/release.keystore" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --no-daemon
          else
            echo "⚠️ No keystore found, building unsigned release AAB"
            ./gradlew bundleRelease --no-daemon
          fi
      
      - name: Generate checksums
        run: |
          cd mobile-app/android/app/build/outputs
          if [ -f "apk/release/app-release.apk" ]; then
            sha256sum apk/release/app-release.apk > apk/release/app-release.apk.sha256
          fi
          if [ -f "bundle/release/app-release.aab" ]; then
            sha256sum bundle/release/app-release.aab > bundle/release/app-release.aab.sha256
          fi
      
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            mobile-app/android/app/build/outputs/apk/release/app-release.apk
            mobile-app/android/app/build/outputs/apk/release/app-release.apk.sha256
            mobile-app/android/app/build/outputs/bundle/release/app-release.aab
            mobile-app/android/app/build/outputs/bundle/release/app-release.aab.sha256
      
      - name: Clean up keystore
        if: always()
        run: rm -f mobile-app/android/app/release.keystore
