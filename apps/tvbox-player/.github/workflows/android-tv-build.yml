name: Android TV Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/android-tv-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/android-tv-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x android-tv-app/gradlew
      
      - name: Run lint
        run: |
          cd android-tv-app
          ./gradlew lintDebug --no-daemon
      
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android-tv-app/app/build/reports/lint-results-*.html

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x android-tv-app/gradlew
      
      - name: Run unit tests
        run: |
          cd android-tv-app
          ./gradlew test --no-daemon
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            android-tv-app/app/build/reports/tests/
            android-tv-app/app/build/test-results/

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x android-tv-app/gradlew
      
      - name: Build debug APK
        run: |
          cd android-tv-app
          ./gradlew assembleDebug --no-daemon
      
      - name: Get APK size
        run: |
          APK_SIZE=$(stat -f%z android-tv-app/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || stat -c%s android-tv-app/app/build/outputs/apk/debug/app-debug.apk)
          APK_SIZE_MB=$((APK_SIZE / 1024 / 1024))
          echo "APK Size: ${APK_SIZE_MB}MB"
          if [ $APK_SIZE_MB -gt 50 ]; then
            echo "⚠️ Warning: APK size exceeds 50MB limit"
          fi
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-tv-app/app/build/outputs/apk/debug/app-debug.apk

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x android-tv-app/gradlew
      
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-tv-app/release.keystore
      
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android-tv-app
          if [ -f "release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --no-daemon
          else
            echo "⚠️ No keystore found, building unsigned release APK"
            ./gradlew assembleRelease --no-daemon
          fi
      
      - name: Get APK size and generate checksum
        run: |
          APK_PATH="android-tv-app/app/build/outputs/apk/release/app-release.apk"
          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
          APK_SIZE_MB=$((APK_SIZE / 1024 / 1024))
          echo "APK Size: ${APK_SIZE_MB}MB"
          
          if [ $APK_SIZE_MB -gt 50 ]; then
            echo "❌ Error: APK size (${APK_SIZE_MB}MB) exceeds 50MB limit!"
            exit 1
          fi
          
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"
          echo "SHA-256 checksum generated"
      
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android-tv-app/app/build/outputs/apk/release/app-release.apk
            android-tv-app/app/build/outputs/apk/release/app-release.apk.sha256
      
      - name: Clean up keystore
        if: always()
        run: rm -f android-tv-app/release.keystore
